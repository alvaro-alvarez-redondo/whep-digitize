[project]
name = "whep-digitize"
version = "0.1.0"
description = "WHEP digitization pipeline — a deterministic Python/Polars ETL pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WHEP" }]
keywords = ["whep", "etl", "polars", "pipeline", "digitization"]

# Runtime dependencies. Kept deliberately lean.
dependencies = [
    "polars>=1.0",          # the sole dataframe engine: columnar, multi-threaded, deterministic
    "numpy>=1.26",          # coverage visualizations use numpy for scaling and density math
    "pandas>=2.2",          # local IO/wrangling boundary for the new visualization module
    "plotly>=5.22",         # interactive coverage charts
    "kaleido>=0.2",         # static PNG export for plotly figures
    "pydantic>=2.7",        # schema validation for the Config model
    "pydantic-settings>=2.3", # runtime options via WHEP_* env vars
    "rich>=13.7",           # console output + progress bars
    "typer>=0.12",          # CLI front-end for run_pipeline
    "fastexcel>=0.10",      # fast all-text .xlsx reads (calamine) for polars
    "xlsxwriter>=3.2",      # workbook writing for polars.write_excel
    "openpyxl>=3.1",        # styled per-cell audit workbooks
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
whep-digitize = "whep_digitize.cli:app"

[project.urls]
Homepage = "https://github.com/eduaguilera/whep"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whep_digitize", "src/scope"]

# ---------------------------------------------------------------------------
# Ruff — lint + format. Enforces the engineering standards from CLAUDE.md:
# snake_case (N), Google-style docstrings (D), pathlib over os.path (PTH).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming (snake_case enforcement)
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "ARG",       # unused arguments
    "RUF",       # ruff-specific
    "D",         # pydocstyle (per-function docstrings)
]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (multi-line summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]  # tests need not be documented

# ---------------------------------------------------------------------------
# mypy — strict typing across the package and the test suite.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src", "tests"]
cache_dir = ".cache/mypy"

# Third-party modules without type stubs: fastexcel/xlsxwriter at the ingest Excel IO
# boundary; openpyxl at the postpro audit styled-workbook boundary.
[[tool.mypy.overrides]]
module = ["fastexcel.*", "xlsxwriter.*", "openpyxl.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest — the ground-truth metric. pythonpath=src lets tests import
# whep_digitize without an editable install.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
addopts = "--strict-markers --strict-config -ra"
markers = [
    "parity: tests that assert output against the frozen reference goldens",
    "slow: long-running tests (full-dataset / benchmark-scale)",
]

[tool.coverage.run]
source = ["whep_digitize"]
branch = true
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = false
# CI coverage gate. CI runs the identical suite to a local run — the goldens are committed, so
# the parity tests execute there rather than skipping. The floor sits ~1pt below the real number
# so routine churn does not trip the gate.
fail_under = 91
